name: Linux Desktop AppImage

on:
  push:
    branches: [build/linux-appimage]
    paths:
      - "desktopApp/**"
      - "desktopUi/**"
      - "shared/**"
      - "native/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/linux-appimage.yml"
  pull_request:
    paths:
      - "desktopApp/**"
      - "desktopUi/**"
      - "shared/**"
      - "native/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/linux-appimage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Restore and package native Linux desktop app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install native build and AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build rpm fakeroot binutils file libfuse2 squashfs-tools

      - name: Run desktop and shared tests
        run: ./gradlew --no-daemon :shared:jvmTest :desktopUi:jvmTest :desktopApp:test

      - name: Build native desktop application image
        run: ./gradlew --no-daemon :desktopApp:createDistributable

      - name: Download AppImage tooling
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Assemble and verify AppImage
        run: |
          mkdir -p dist
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            dist/BitChord-1.9-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"
          test -s dist/BitChord-1.9-linux-x86_64.AppImage
          file dist/BitChord-1.9-linux-x86_64.AppImage | grep -q "ELF"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/BitChord-1.9-linux-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          rm -rf squashfs-root

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BitWave-linux-x86_64-AppImage
          path: dist/BitChord-1.9-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
