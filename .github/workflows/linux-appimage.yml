name: Linux AppImage

on:
  push:
    branches: [build/linux-appimage]
    paths:
      - 'desktop/**'
      - 'scripts/build-linux-appimage.sh'
      - 'shared/**'
      - 'sharedUi/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/linux-appimage.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/build-linux-appimage.sh'
      - 'shared/**'
      - 'sharedUi/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/linux-appimage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Build Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install AppImage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libfuse2 squashfs-tools

      - name: Test shared JVM modules
        run: ./gradlew --no-daemon :shared:jvmTest :sharedUi:jvmTest

      # Build the Compose application image, then wrap it as a real AppImage.
      # Use the non-ProGuard task until the release shrinker rules are repaired.
      - name: Build and verify Linux AppImage
        run: bash ./scripts/build-linux-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BitWave-linux-x86_64-AppImage
          path: dist/BitWave-1.0.0-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
