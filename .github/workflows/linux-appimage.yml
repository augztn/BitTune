name: Linux Desktop AppImage

on:
  push:
    branches: [build/linux-appimage]
    tags: ["v*"]
    paths:
      - "desktopApp/**"
      - "desktopUi/**"
      - "shared/**"
      - "native/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/linux-appimage.yml"
  pull_request:
    paths:
      - "desktopApp/**"
      - "desktopUi/**"
      - "shared/**"
      - "native/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/linux-appimage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Restore and package native Linux desktop app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install native build and AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build rpm fakeroot binutils file libfuse2 squashfs-tools

      - name: Run desktop and shared tests
        run: ./gradlew --no-daemon :shared:jvmTest :desktopUi:jvmTest :desktopApp:test

      - name: Build native desktop application image
        run: ./gradlew --no-daemon -Pbitchord.target=linux -Pbitchord.version=1.9 :desktopApp:createDistributable

      - name: Download AppImage tooling
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Assemble and verify AppImage
        run: |
          mkdir -p dist
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            dist/BitTune-1.9-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"
          test -s dist/BitTune-1.9-linux-x86_64.AppImage
          file dist/BitTune-1.9-linux-x86_64.AppImage | grep -q "ELF"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/BitTune-1.9-linux-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          rm -rf squashfs-root

      - name: Generate SHA-256 checksum
        run: |
          cd dist
          sha256sum BitTune-1.9-linux-x86_64.AppImage > SHA256SUMS

      - name: Upload Linux AppImage (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: BitTune-linux-x86_64-AppImage
          path: |
            dist/BitTune-1.9-linux-x86_64.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      # Keep a stable direct-download release for branch builds. The tag is
      # intentionally moved to this branch's latest successful commit.
      - name: Update rolling AppImage download tag
        if: github.ref == 'refs/heads/build/linux-appimage'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'linux-appimage-latest';
            const ref = `tags/${tag}`;
            try {
              await github.rest.git.getRef({
                ...context.repo,
                ref
              });
              await github.rest.git.updateRef({
                ...context.repo,
                ref,
                sha: context.sha,
                force: true
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                ...context.repo,
                ref: `refs/${ref}`,
                sha: context.sha
              });
            }

      - name: Publish standalone AppImage to GitHub Release
        if: github.ref == 'refs/heads/build/linux-appimage' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/build/linux-appimage' && 'linux-appimage-latest' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref == 'refs/heads/build/linux-appimage' && 'Latest Linux AppImage (build branch)' || github.ref_name }}
          prerelease: ${{ github.ref == 'refs/heads/build/linux-appimage' }}
          make_latest: false
          overwrite_files: true
          files: |
            dist/BitTune-1.9-linux-x86_64.AppImage
            dist/SHA256SUMS
          generate_release_notes: true
